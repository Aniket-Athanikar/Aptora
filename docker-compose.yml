name: aptora

services:
  postgres:
    image: postgres:15-alpine
    container_name: aptora_postgres
    environment:
      POSTGRES_DB: aptora_db
      POSTGRES_USER: aptora_user
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptora_user -d aptora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aptora-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aptora_redis
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aptora-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aptora_qdrant
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aptora-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aptora_backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aptora_db
      DB_USER: aptora_user
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: aptora_documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - aptora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aptora_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    expose:
      - "3000"
    networks:
      - aptora-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aptora_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aptora-network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  qdrant_data:

networks:
  aptora-network:
    name: aptora-network
    driver: bridge