version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: examforge_postgres
    environment:
      POSTGRES_DB: Exame_forgeDB
      POSTGRES_USER: aniket
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: examforge_redis
    ports:
      - "6479:6379"
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: examforge_qdrant
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      - ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=Exame_forgeDB
      - DB_USER=aniket
      - DB_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - ./backend/app/uploads:/app/app/uploads
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # Indexing is deliberately a separate long-running process.  Previously
  # uploads were only enqueued, but no compose service consumed the queue.
  # This left PostgreSQL rows in UPLOADED state and Qdrant empty.
  resource-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: python -m app.workers.resource_worker
    environment:
      - ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=Exame_forgeDB
      - DB_USER=aniket
      - DB_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=768
    volumes:
      - ./backend/app/uploads:/app/app/uploads
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - examforge-network
    restart: always
    # This is a queue consumer, not an HTTP server; inheriting the backend
    # image's /health probe would permanently mark a healthy worker unhealthy.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: examforge_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - examforge-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  pgdata:
  qdrant_data:

networks:
  examforge-network:
    driver: bridge
