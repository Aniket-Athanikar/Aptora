name: aptora

services:
  postgres:
    image: postgres:15-alpine
    container_name: aptora_postgres

    environment:
      POSTGRES_DB: aptora_db
      POSTGRES_USER: aptora_user
      POSTGRES_PASSWORD: admin123

    ports:
      - "5433:5432"

    volumes:
      - aptora_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptora_user -d aptora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - aptora-network

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: aptora_redis

    ports:
      - "6479:6379"

    volumes:
      - aptora_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - aptora-network

    restart: unless-stopped


  qdrant:
    image: qdrant/qdrant:latest
    container_name: aptora_qdrant

    ports:
      - "6433:6333"
      - "6434:6334"

    volumes:
      - aptora_qdrant_data:/qdrant/storage

    networks:
      - aptora-network

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aptora_backend

    env_file:
      - ./backend/.env

    environment:
      # =========================
      # DATABASE
      # =========================
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aptora_db
      DB_USER: aptora_user
      DB_PASSWORD: admin123

      # =========================
      # REDIS
      # =========================
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # =========================
      # QDRANT
      # =========================
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: aptora_documents

      # =========================
      # SMTP / EMAIL
      # =========================
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: ${MAIL_SERVER}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      qdrant:
        condition: service_started

    volumes:
      - ./backend/app/uploads:/app/app/uploads

    expose:
      - "8000"

    networks:
      - aptora-network

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

    container_name: aptora_frontend

    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

    expose:
      - "3000"

    networks:
      - aptora-network

    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: aptora_nginx

    depends_on:
      - backend
      - frontend

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - aptora-network

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:
  aptora_pgdata:
    name: aptora_pgdata

  aptora_redis_data:
    name: aptora_redis_data

  aptora_qdrant_data:
    name: aptora_qdrant_data


# ============================================================
# NETWORK
# ============================================================

networks:
  aptora-network:
    name: aptora-network
    driver: bridge