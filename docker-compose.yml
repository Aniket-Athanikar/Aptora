services:
  postgres:
    image: postgres:15-alpine
    container_name: examforge_postgres
    environment:
      POSTGRES_DB: Exame_forgeDB
      POSTGRES_USER: aniket
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: examforge_redis
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: examforge_qdrant
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examforge_backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: Exame_forgeDB
      DB_USER: aniket
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: examforge_documents
    depends_on:
      - postgres
      - redis
      - qdrant
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: examforge_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  qdrant_data: