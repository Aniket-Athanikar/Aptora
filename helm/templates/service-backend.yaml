apiVersion: v1
kind: Service
metadata:
  name: {{ include "Aptora.fullname" . }}-backend
  labels:
    app: {{ include "Aptora.name" . }}-backend
spec:
  ports:
  - port: {{ .Values.service.backendPort }}
    targetPort: {{ .Values.service.backendPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ include "Aptora.name" . }}-backend
