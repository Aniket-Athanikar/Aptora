apiVersion: v1
kind: Service
metadata:
  name: {{ include "Aptora.fullname" . }}-frontend
  labels:
    app: {{ include "Aptora.name" . }}-frontend
spec:
  ports:
  - port: {{ .Values.service.frontendPort }}
    targetPort: {{ .Values.service.frontendPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ include "Aptora.name" . }}-frontend
