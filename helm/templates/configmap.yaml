apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "examforge.fullname" . }}-config
  labels:
    app: {{ include "examforge.name" . }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  QDRANT_HOST: {{ .Values.config.qdrantHost | quote }}
  QDRANT_PORT: {{ .Values.config.qdrantPort | quote }}
  ENV: {{ .Values.config.env | quote }}
