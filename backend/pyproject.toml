[project]
name = "examforge-ai-backend"
version = "2.1.0"
description = "Enterprise-grade backend API for ExamForge AI"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
