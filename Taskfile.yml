version: '3'

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: List all available Aptora automation tasks
    cmds:
      - task --list

  dev:
    desc: Start local development stack (Postgres, Redis, Qdrant, Backend, Frontend, Nginx)
    cmds:
      - docker compose -f docker-compose.yml up --build -d

  prod:
    desc: Start production stack with environment overrides
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

  monitoring:
    desc: Start Aptora monitoring stack (Prometheus, Grafana, Loki, Promtail)
    cmds:
      - docker compose -f docker-compose.monitoring.yml up -d

  down:
    desc: Shutdown all active Aptora Docker containers
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml down

  status:
    desc: Display status of all active Aptora containers
    cmds:
      - docker compose ps

  logs:
    desc: Stream logs from all Aptora containers
    cmds:
      - docker compose logs -f --tail=100

  test:
    desc: Run pytest unit tests for Aptora backend
    cmds:
      - cd backend && pytest tests/ -v --cov=app --cov-report=term-missing

  test-frontend:
    desc: Type check and test Aptora frontend
    cmds:
      - cd frontend && npm run build

  lint:
    desc: Lint Python backend and Next.js frontend
    cmds:
      - cd backend && ruff check app/ && ruff format --check app/
      - cd frontend && npm run lint

  migrate:
    desc: Run database head migrations
    cmds:
      - cd backend && alembic upgrade head

  clean:
    desc: Remove build artifacts, cache, and temporary docker state
    cmds:
      - cd frontend && npm run clean
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type d -name ".pytest_cache" -exec rm -rf {} +

  deploy:
    desc: Deploy to Kubernetes namespace
    cmds:
      - kubectl apply -f k8s/namespace.yaml
      - kubectl apply -f k8s/configmap.yaml
      - kubectl apply -f k8s/secret.yaml
      - kubectl apply -f k8s/network-policy.yaml
      - kubectl apply -f k8s/db-statefulset.yaml
      - kubectl apply -f k8s/redis-statefulset.yaml
      - kubectl apply -f k8s/backend-deployment.yaml
      - kubectl apply -f k8s/frontend-deployment.yaml
      - kubectl apply -f k8s/ingress.yaml
      - kubectl apply -f k8s/hpa.yaml
