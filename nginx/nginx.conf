user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # ============================================================
    # LOGGING
    # ============================================================

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;


    # ============================================================
    # PERFORMANCE
    # ============================================================

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    types_hash_max_size 2048;


    # ============================================================
    # GZIP
    # ============================================================

    gzip on;

    gzip_disable "msie6";

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;


    # ============================================================
    # UPSTREAMS
    # ============================================================

    upstream backend_servers {
        server backend:8000;
    }

    upstream frontend_servers {
        server frontend:3000;
    }


    # ============================================================
    # APTORA SERVER
    # ============================================================

    server {
        listen 80;

        server_name localhost;

        client_max_body_size 50M;


        # ========================================================
        # API HEALTH
        #
        # Browser:
        #   /api/health
        #
        # Backend:
        #   /health
        #
        # Special mapping because backend health endpoint
        # does not contain /api.
        # ========================================================

        location = /api/health {

            proxy_pass http://backend_servers/health;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;
        }


        # ========================================================
        # API
        #
        # Browser:
        #   /api/auth/login
        #   /api/workspace
        #   /api/notifications
        #
        # Backend:
        #   /api/auth/login
        #   /api/workspace
        #   /api/notifications
        #
        # IMPORTANT:
        # proxy_pass intentionally has NO trailing slash.
        #
        # This preserves the /api prefix.
        # ========================================================

        location /api {

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            # ----------------------------------------------------
            # WebSocket support
            # ----------------------------------------------------

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            # ----------------------------------------------------
            # Streaming / AI responses
            # ----------------------------------------------------

            proxy_buffering off;

            # ----------------------------------------------------
            # Timeouts
            # ----------------------------------------------------

            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;
        }


        # ========================================================
        # UPLOADS / PROFILE IMAGES
        #
        # Browser:
        #
        #   /uploads/profile/5/avatar.webp
        #
        # Nginx:
        #
        #   /uploads/...
        #
        # Backend:
        #
        #   FastAPI must expose /uploads
        #
        # This location MUST appear before location /
        # so uploads are sent to the backend instead of Next.js.
        # ========================================================

        location /uploads/ {

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            # ----------------------------------------------------
            # Do not cache missing/upload responses aggressively
            # while debugging.
            # ----------------------------------------------------

            proxy_buffering off;

            # ----------------------------------------------------
            # Timeouts
            # ----------------------------------------------------

            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;
        }


        # ========================================================
        # FASTAPI DOCUMENTATION
        # ========================================================

        location = /docs {

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;

            proxy_send_timeout 300s;
        }


        # ========================================================
        # OPENAPI JSON
        # ========================================================

        location = /openapi.json {

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;

            proxy_send_timeout 300s;
        }


        # ========================================================
        # REDOC
        # ========================================================

        location = /redoc {

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;

            proxy_send_timeout 300s;
        }


        # ========================================================
        # NGINX STATUS
        # ========================================================

        location = /nginx_status {

            stub_status on;

            access_log off;

            allow 127.0.0.1;

            allow 172.16.0.0/12;

            allow 192.168.0.0/16;

            allow 10.0.0.0/8;

            deny all;
        }


        # ========================================================
        # FRONTEND
        #
        # Everything not matched above goes to Next.js.
        #
        # IMPORTANT:
        # Keep this LAST.
        # ========================================================

        location / {

            proxy_pass http://frontend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            # ----------------------------------------------------
            # Next.js WebSocket / upgrade support
            # ----------------------------------------------------

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            # ----------------------------------------------------
            # Next.js timeouts
            # ----------------------------------------------------

            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;
        }
    }
}