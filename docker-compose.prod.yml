services:
  postgres:
    ports: []
    environment:
      POSTGRES_DB: aptora_db_prod
      POSTGRES_USER: aptora_prod_user
    restart: always

  redis:
    ports: []
    restart: always

  qdrant:
    ports: []
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      - ENV=production
      - DB_NAME=aptora_db_prod
      - DB_USER=aptora_prod_user
    volumes:
      - ./backend/app/uploads:/app/app/uploads
    ports: []
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports: []
    environment:
      - NEXT_PUBLIC_API_URL=https://api.aptora.ai
    restart: always

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
