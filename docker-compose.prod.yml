version: '3.8'

services:
  postgres:
    ports: [] # Close host port bindings in production
    environment:
      POSTGRES_DB: examforgedb_prod
      POSTGRES_USER: examforge_prod_admin
    # In production, pass secret via environment variables or docker secrets
    restart: always

  redis:
    ports: [] # Close host port bindings in production
    restart: always

  qdrant:
    ports: [] # Close host port bindings in production
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      - ENV=production
      - DB_NAME=examforgedb_prod
      - DB_USER=examforge_prod_admin
    ports: []
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports: []
    environment:
      - NEXT_PUBLIC_API_URL=https://api.examforge.ai
    restart: always

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
