stages:
  - validate
  - install
  - build
  - test
  - security
  - package
  - deploy-staging
  - deploy-production
  - rollback
  - release

variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest

# ──────────────────────────────────────────────
# Stage: Validate & Lint
# ──────────────────────────────────────────────
lint-backend:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install ruff
    - ruff check backend/app/
    - ruff format --check backend/app/
  only:
    - merge_requests
    - develop
    - main

lint-frontend:
  stage: validate
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
  only:
    - merge_requests
    - develop
    - main

# ──────────────────────────────────────────────
# Stage: Test
# ──────────────────────────────────────────────
test-backend:
  stage: test
  image: python:3.11-slim
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: test_examforgedb
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: test_examforgedb
    DB_USER: test_user
    DB_PASSWORD: test_pass
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SECRET_KEY: gitlab-ci-test-secret
    ENV: test
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest tests/ -v --cov=app --cov-report=term-missing
  only:
    - merge_requests
    - develop
    - main

# ──────────────────────────────────────────────
# Stage: Security
# ──────────────────────────────────────────────
security-bandit:
  stage: security
  image: python:3.11-slim
  script:
    - pip install bandit
    - bandit -r backend/app/
  allow_failure: true

security-trivy:
  stage: security
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL python:3.11-slim
  allow_failure: true

# ──────────────────────────────────────────────
# Stage: Build & Package (Docker build)
# ──────────────────────────────────────────────
build-docker-images:
  stage: package
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -f docker/backend.Dockerfile backend/
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -f docker/frontend.Dockerfile frontend/
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
  only:
    - develop
    - main
    - tags

# ──────────────────────────────────────────────
# Stage: Deploy
# ──────────────────────────────────────────────
deploy-to-staging:
  stage: deploy-staging
  image: dtzar/helm-kubectl
  script:
    - kubectl config set-cluster staging --server="$KUBE_URL" --insecure-skip-tls-verify=true
    - kubectl config set-credentials admin --token="$KUBE_TOKEN"
    - kubectl config set-context staging --cluster=staging --user=admin --namespace=staging
    - kubectl config use-context staging
    - kubectl apply -f k8s/
  only:
    - develop

deploy-to-production:
  stage: deploy-production
  image: dtzar/helm-kubectl
  script:
    - kubectl config set-cluster prod --server="$KUBE_URL_PROD" --insecure-skip-tls-verify=true
    - kubectl config set-credentials admin --token="$KUBE_TOKEN_PROD"
    - kubectl config set-context prod --cluster=prod --user=admin --namespace=production
    - kubectl config use-context prod
    - kubectl apply -f k8s/
  only:
    - tags
  when: manual
