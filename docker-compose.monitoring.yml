version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: examforge_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - examforge-network
    restart: always

  grafana:
    image: grafana/grafana:10.0.0
    container_name: examforge_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - examforge-network
    depends_on:
      - prometheus
    restart: always

  loki:
    image: grafana/loki:2.8.2
    container_name: examforge_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - examforge-network
    restart: always

  promtail:
    image: grafana/promtail:2.8.2
    container_name: examforge_promtail
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - examforge-network
    depends_on:
      - loki
    restart: always

volumes:
  prometheus_data:
  grafana_data:

networks:
  examforge-network:
    external: true
    name: docker-compose_examforge-network
