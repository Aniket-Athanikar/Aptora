services:
  postgres:
    image: postgres:15-alpine
    container_name: aptora_postgres
    environment:
      POSTGRES_DB: aptora_db
      POSTGRES_USER: aptora_user
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aptora_redis
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aptora_qdrant
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  redis_data:
  qdrant_data: