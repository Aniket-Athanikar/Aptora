global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aptora-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'aptora-frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['frontend:3000']
    ignore_namespaces: true

  - job_name: 'aptora-nginx'
    metrics_path: '/nginx_status'
    static_configs:
      - targets: ['nginx:80']
